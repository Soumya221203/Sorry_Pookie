<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>For Deepanshi 💗</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: 'Arial', sans-serif;
      background: linear-gradient(to bottom, #ffeef2, #ffd6e0);
      overflow-x: hidden;
    }

    .container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 25px;
      padding: 25px;
      max-width: 380px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    }

    h2 {
      color: #ff4d6d;
      margin-bottom: 10px;
    }

    p {
      font-size: 16px;
      color: #333;
    }

    button {
      width: 100%;
      margin-top: 12px;
      padding: 14px;
      border: none;
      border-radius: 30px;
      background: #ff6b81;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    button:hover {
      background: #ff4d6d;
    }

    .heart {
      position: fixed;
      bottom: -20px;
      font-size: 20px;
      animation: floatUp 5s linear infinite;
      opacity: 0.7;
    }

    @keyframes floatUp {
      0% { transform: translateY(0); opacity: 0.7; }
      100% { transform: translateY(-100vh); opacity: 0; }
    }

    .love {
      font-size: 22px;
      color: #ff4d6d;
      margin-top: 15px;
    }
    @keyframes shake {
  0% { transform: translateX(0); }
  25% { transform: translateX(-6px); }
  50% { transform: translateX(6px); }
  75% { transform: translateX(-6px); }
  100% { transform: translateX(0); }
}
  </style>
</head>

<body>

<audio id="bgMusic" loop>
  <source src="https://cdn.pixabay.com/audio/2022/10/16/audio_7e61bb0a9d.mp3" type="audio/mpeg">
</audio>

<div class="container">
  <div class="card" id="card">
    <h2>Hey Deepanshi 🩷</h2>
    <p id="question">Pookie… can you promise to answer honestly?</p>
    <button onclick="next()">Okay baccha 😌</button>
  </div>
</div>

<script>
  let step = 0;

  const card = document.getElementById("card");

  function vibrate() {
    if (navigator.vibrate) navigator.vibrate(60);
  }

  function startMusic() {
    document.getElementById("bgMusic").play();
  }

  function next() {
    vibrate();
    step++;

    if (step === 1) {
      startMusic();
      card.innerHTML = `
        <h2>Deepanshi 💗</h2>
        <p>Are you still angry with me?</p>
        <button onclick="next()">Yes 😡</button>
        <button onclick="next()">Thoda sa 😐</button>
        <button onclick="next()">No but drama chalu hai 😌</button>
      `;
    }

    else if (step === 2) {
      card.innerHTML = `
        <h2>Pookie 🧸</h2>
        <p>Do you still care about this idiot (me)?</p>
        <button onclick="next()">Yes</button>
        <button onclick="next()">Definitely yes</button>
        <button onclick="next()">Obviously 🙄</button>
      `;
    }

    else if (step === 3) {
      card.innerHTML = `
        <h2>Baccha 🩷</h2>
        <p>On a scale of 1–10, how badly did I mess up?</p>
        <input type="range" min="1" max="10" value="7" style="width:100%">
        <button onclick="next()">Submit 😭</button>
      `;
    }

    else if (step === 4) {
      card.innerHTML = `
        <h2>Deepanshi 💭</h2>
        <p>What do you miss the most about us?</p>
        <button onclick="next()">Talking randomly</button>
        <button onclick="next()">My stupid jokes</button>
        <button onclick="next()">Everything 😔</button>
      `;
    }

    else if (step === 5) {
      card.innerHTML = `
        <h2>Pookie 🥺</h2>
        <p>One word you would use for me right now?</p>
        <input type="text" placeholder="Type here..." style="width:100%;padding:10px;border-radius:10px;border:1px solid #ccc;">
        <button onclick="next()">Okay 😶</button>
      `;
    }

    else if (step === 6) {
      card.innerHTML = `
        <h2>Baccha 🌱</h2>
        <p>Do you think I can actually improve?</p>
        <button onclick="next()">Maybe</button>
        <button onclick="next()">Yes, if you try</button>
        <button onclick="next()">Surprisingly… yes</button>
      `;
    }

    else if (step === 7) {
  card.innerHTML = `
    <h2>Deepanshi 💗</h2>
    <p>Would you slap me or hug me first?</p>

    <button onclick="fake()">Ignore you 😤</button>
    <button onclick="next()">Slap 👋</button>
    <button onclick="next()">Hug 🤍</button>
    <button onclick="next()">Both 🙃</button>

    <p id="warning" style="color:#ff4d6d;margin-top:10px;"></p>
  `;
}

    else if (step === 8) {
      card.innerHTML = `
        <h2>Pookie 🧸</h2>
        <p>Can I still call you mine?</p>
        <button onclick="next()">Yes</button>
        <button onclick="next()">Obviously</button>
        <button onclick="next()">Always 💞</button>
      `;
    }

    else if (step === 9) {
      card.innerHTML = `
        <h2>Baccha 🥹</h2>
        <p>Will you give me one more chance?</p>
        <button onclick="next()">Yes</button>
        <button onclick="next()">Okay but don’t mess up</button>
        <button onclick="next()">I already did 😌</button>
      `;
    }

    else {
      finalLove();
    }
  }

  function finalLove() {
    card.innerHTML = `
      <h2>Hey Deepanshi 🩷</h2>
      <p>
        I know I mess up.<br><br>
        But my feelings for you are real.<br>
        And they’re not going anywhere.
      </p>
      <div class="love">I LOVE YOU 💗💗💗</div>
      <button onclick="heartShower()">Come here 🥺</button>
    `;
  }
function fake() {
  vibrate();
  const warn = document.getElementById("warning");
  warn.innerText = "Nice try 😌 not an option.";

  // shake effect
  card.style.animation = "shake 0.3s";
  setTimeout(() => card.style.animation = "", 300);
}

  function heartShower() {
    for (let i = 0; i < 60; i++) {
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.innerHTML = "💗";
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.animationDuration = (2 + Math.random() * 3) + "s";
      document.body.appendChild(heart);

      setTimeout(() => heart.remove(), 5000);
    }
  }

  setInterval(() => {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = "💗";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.animationDuration = "6s";
    document.body.appendChild(heart);

    setTimeout(() => heart.remove(), 6000);
  }, 700);
</script>

</body>
</html>
